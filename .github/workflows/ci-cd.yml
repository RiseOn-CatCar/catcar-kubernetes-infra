name: Kubernetes Infra CI/CD

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      - name: Terraform Validate
        run: terraform validate

  validate-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init Alerts
        run: terraform -chdir=alerts init -backend=false
      - name: Terraform Format Check Alerts
        run: terraform -chdir=alerts fmt -check -recursive
      - name: Terraform Validate Alerts
        run: terraform -chdir=alerts validate


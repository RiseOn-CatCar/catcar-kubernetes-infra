name: Kubernetes Infra CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: catcar-kubernetes-infra-prod
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  TF_VAR_resource_group_name: ${{ vars.CATCAR_FOUNDATION_RESOURCE_GROUP || 'catcar-prod' }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION || 'eastus' }}

jobs:
  validate-k8s:
    name: Validate K8s Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      - name: Terraform Validate
        run: terraform validate

  validate-alerts:
    name: Validate Alerts Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init Alerts
        run: terraform -chdir=alerts init -backend=false
      - name: Terraform Format Check Alerts
        run: terraform -chdir=alerts fmt -check -recursive
      - name: Terraform Validate Alerts
        run: terraform -chdir=alerts validate

  plan-and-apply-production:
    name: Apply Production Foundation
    needs: [validate-k8s, validate-alerts]
    if: startsWith(github.ref, 'refs/tags/v') && (vars.AZURE_CLIENT_ID != '' || vars.AZURE_DEPLOY_CLIENT_ID != '')
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID || vars.AZURE_CLIENT_ID }}
      TF_VAR_environment: prod
      TF_VAR_resource_group_name: ${{ vars.CATCAR_FOUNDATION_RESOURCE_GROUP || 'catcar-prod' }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION || 'eastus' }}
      TF_VAR_customer_jwt_signing_key: ${{ secrets.CUSTOMER_JWT_SIGNING_KEY }}
      TF_VAR_admin_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_gateway_backend_key: ${{ secrets.GATEWAY_BACKEND_KEY }}
      TF_VAR_apim_publisher_name: ${{ vars.APIM_PUBLISHER_NAME || 'CatCar Operations' }}
      TF_VAR_apim_publisher_email: ${{ vars.APIM_PUBLISHER_EMAIL || 'operations@catcar.com' }}
      TF_VAR_aks_sku_tier: Free
      TF_VAR_aks_vm_size: Standard_B2s
      TF_VAR_aks_min_node_count: 1
      TF_VAR_aks_max_node_count: 2
      TF_VAR_aks_cluster_id: ${{ vars.CATCAR_AKS_CLUSTER_ID || '' }}
      TF_VAR_application_insights_id: ${{ vars.CATCAR_APPLICATION_INSIGHTS_ID || '' }}
      TF_VAR_log_analytics_workspace_id: ${{ vars.CATCAR_LOG_ANALYTICS_WORKSPACE_ID || '' }}
      TF_VAR_health_probe_url: ${{ vars.CATCAR_HEALTH_PROBE_URL }}
      TF_VAR_alert_email: ${{ vars.CATCAR_ALERT_EMAIL || 'alerts@catcar.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Release Tag Contract
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Validating tag $TAG_NAME..."
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG_NAME does not follow strict SemVer syntax (vX.Y.Z)"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not reachable from origin/main"
            exit 1
          fi
          echo "Tag $TAG_NAME contract validated successfully."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init (K8s Production)
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.AZURE_TF_STATE_RG || 'catcar-tfstate' }}" \
            -backend-config="storage_account_name=${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT || 'stcatcartfstate' }}" \
            -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER || 'tfstate' }}" \
            -backend-config="key=catcar-kubernetes.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan & Apply (K8s Production)
        run: |
          terraform plan -input=false -out=k8s.tfplan
          terraform apply -input=false -auto-approve k8s.tfplan

      - name: Terraform Init (Alerts Production)
        if: vars.CATCAR_AKS_CLUSTER_ID != '' && vars.CATCAR_APPLICATION_INSIGHTS_ID != '' && vars.CATCAR_LOG_ANALYTICS_WORKSPACE_ID != ''
        run: |
          terraform -chdir=alerts init -input=false \
            -backend-config="resource_group_name=${{ vars.AZURE_TF_STATE_RG || 'catcar-tfstate' }}" \
            -backend-config="storage_account_name=${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT || 'stcatcartfstate' }}" \
            -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER || 'tfstate' }}" \
            -backend-config="key=catcar-alerts.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan & Apply (Alerts Production)
        if: vars.CATCAR_AKS_CLUSTER_ID != '' && vars.CATCAR_APPLICATION_INSIGHTS_ID != '' && vars.CATCAR_LOG_ANALYTICS_WORKSPACE_ID != ''
        run: |
          terraform -chdir=alerts plan -input=false -out=alerts.tfplan
          terraform -chdir=alerts apply -input=false -auto-approve alerts.tfplan
